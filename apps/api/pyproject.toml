[project]
name = "pbac-api"
version = "0.1.0"
description = "Proactive Business Analytics Copilot - PoC API (synthetic data only)"
requires-python = ">=3.11"

[tool.ruff]
line-length = 240
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = ["S101", "S311", "B008", "E731"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "B017", "S314"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
